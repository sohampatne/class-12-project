<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IP Matplotlib Charts - 1 Page Portrait Sheet</title>
<style>
  @page {
    size: A4 portrait;
    margin: 8mm 10mm;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #ffffff; font-family: Arial, sans-serif; }
  .sheet {
    width: 190mm;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 280mm;
  }
  .top-row {
    display: flex;
    justify-content: center;
    width: 100%;
    margin-bottom: 4mm;
  }
  .bottom-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    gap: 6mm;
  }
  .chart-box-large {
    text-align: center;
    width: 100%;
  }
  .chart-box-large img {
    max-width: 110mm;
    max-height: 125mm;
    object-fit: contain;
    border: 1px solid #94a3b8;
    border-radius: 4px;
  }
  .chart-box-half {
    text-align: center;
    width: 48%;
  }
  .chart-box-half img {
    width: 100%;
    max-height: 125mm;
    object-fit: contain;
    border: 1px solid #94a3b8;
    border-radius: 4px;
  }
  .cut-tag {
    font-size: 8.5pt;
    font-weight: bold;
    color: #64748b;
    margin-top: 3px;
  }
</style>
</head>
<body>
  <div class="sheet">
    <!-- Top: Practical 14 -->
    <div class="top-row">
      <div class="chart-box-large">
        <img src="p14_win11_matplotlib_screenshot.png" alt="Practical 14 Chart">
        <div class="cut-tag">PRACTICAL 14 (Result Analysis Bar Graph)</div>
      </div>
    </div>

    <!-- Bottom: Practical 15 & Practical 16 Side-by-Side in Portrait -->
    <div class="bottom-row">
      <div class="chart-box-half">
        <img src="p15_win11_matplotlib_screenshot.png" alt="Practical 15 Chart">
        <div class="cut-tag">PRACTICAL 15 (Stream-Wise Position)</div>
      </div>
      <div class="chart-box-half">
        <img src="p16_win11_matplotlib_screenshot.png" alt="Practical 16 Chart">
        <div class="cut-tag">PRACTICAL 16 (Census 2011 Pie Chart)</div>
      </div>
    </div>
  </div>
</body>
</html>
