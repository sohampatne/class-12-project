<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IP Matplotlib Charts - Full Page Portrait Slips</title>
<style>
  @page {
    size: A4 portrait;
    margin: 15mm;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #ffffff; font-family: Arial, sans-serif; }
  .page {
    width: 180mm;
    height: 267mm;
    margin: 0 auto;
    page-break-after: always;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .chart-card {
    text-align: center;
    width: 100%;
  }
  .chart-card img {
    max-width: 165mm;
    max-height: 205mm;
    object-fit: contain;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
  }
  .label-tag {
    font-size: 11pt;
    font-weight: bold;
    color: #475569;
    margin-top: 10px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <!-- PAGE 1: Practical 14 -->
  <div class="page">
    <div class="chart-card">
      <img src="p14_win11_matplotlib_screenshot.png" alt="Practical 14 Chart">
      <div class="label-tag">PRACTICAL 14: RESULT ANALYSIS BAR GRAPH</div>
    </div>
  </div>

  <!-- PAGE 2: Practical 15 -->
  <div class="page">
    <div class="chart-card">
      <img src="p15_win11_matplotlib_screenshot.png" alt="Practical 15 Chart">
      <div class="label-tag">PRACTICAL 15: STREAM-WISE POSITION BAR GRAPH</div>
    </div>
  </div>

  <!-- PAGE 3: Practical 16 -->
  <div class="page">
    <div class="chart-card">
      <img src="p16_win11_matplotlib_screenshot.png" alt="Practical 16 Chart">
      <div class="label-tag">PRACTICAL 16: 2011 CENSUS POPULATION PIE CHART</div>
    </div>
  </div>
</body>
</html>
